<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>whaletail Harness · 分享封面 5:4</title>
<style>
  @page { margin: 0; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1000px; height: 800px; overflow: hidden; background: #04090F; }
  body {
    font-family: "PingFang SC", "Hiragino Sans GB", "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }

  .canvas { position: relative; width: 1000px; height: 800px; overflow: hidden; }

  /* ---------- background ---------- */
  .bg {
    position: absolute; inset: 0;
    background:
      radial-gradient(72% 62% at 76% 46%, rgba(46,107,230,.46) 0%, rgba(26,66,116,.22) 42%, rgba(4,10,20,0) 72%),
      radial-gradient(46% 40% at 84% 76%, rgba(64,168,255,.20) 0%, rgba(4,10,20,0) 70%),
      radial-gradient(55% 48% at 16% 54%, rgba(46,107,230,.12) 0%, rgba(4,10,20,0) 68%),
      radial-gradient(70% 55% at 6% 0%, rgba(58,116,196,.22) 0%, rgba(4,10,20,0) 62%),
      radial-gradient(90% 60% at 34% 108%, rgba(34,92,170,.28) 0%, rgba(4,10,20,0) 72%),
      linear-gradient(160deg, #0B1A2B 0%, #08192A 40%, #050F1B 72%, #03080F 100%);
  }

  /* underwater light shafts */
  .rays { position: absolute; inset: -10%; filter: blur(26px); opacity: .55; }
  .ray { position: absolute; width: 130px; height: 1100px; background: linear-gradient(180deg, rgba(128,180,255,0) 0%, rgba(128,180,255,.16) 18%, rgba(128,180,255,.05) 52%, rgba(128,180,255,0) 78%); transform-origin: 50% 100%; }
  .r1 { left: 118px; top: -180px; transform: rotate(17deg); width: 168px; }
  .r2 { left: 392px; top: -240px; transform: rotate(21deg); opacity: .8; }
  .r3 { left: 690px; top: -300px; transform: rotate(25deg); opacity: .55; width: 220px; }

  /* particle dust */
  .dots {
    position: absolute; inset: 0;
    background-image: radial-gradient(circle, rgba(191,212,255,.5) 0.9px, transparent 1.1px);
    background-size: 26px 26px;
    opacity: .34;
    -webkit-mask-image: radial-gradient(75% 70% at 72% 42%, #000 0%, rgba(0,0,0,.35) 55%, transparent 82%);
    mask-image: radial-gradient(75% 70% at 72% 42%, #000 0%, rgba(0,0,0,.35) 55%, transparent 82%);
  }

  /* ---------- 背景鲸尾（单张，偏右） ---------- */
  .hero-glow {
    position: absolute; left: 50%; margin-left: -394px; top: 80px; width: 700px; height: 700px;
    background: radial-gradient(circle at 54% 48%, rgba(96,156,255,.44) 0%, rgba(46,107,230,.20) 40%, rgba(20,50,96,.08) 60%, rgba(4,10,20,0) 74%);
    filter: blur(24px);
  }
  .hero {
    position: absolute; left: 50%; margin-left: -330px; top: 118px; width: 600px; height: 600px;
    transform: rotate(-4deg);
    opacity: .76;
  }
  .hero img { display: block; width: 100%; height: 100%; object-fit: contain;
    filter: blur(.6px) drop-shadow(0 0 40px rgba(120,178,255,.30)) drop-shadow(0 18px 90px rgba(46,107,230,.34)); }
  .hero-tips {
    position: absolute; left: 50%; margin-left: -330px; top: 118px; width: 600px; height: 600px;
    transform: rotate(-4deg);
    opacity: .95; mix-blend-mode: screen;
    -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,1) 0%, rgba(0,0,0,.92) 12%, rgba(0,0,0,.45) 24%, rgba(0,0,0,.10) 33%, transparent 40%);
    mask-image: linear-gradient(to bottom, rgba(0,0,0,1) 0%, rgba(0,0,0,.92) 12%, rgba(0,0,0,.45) 24%, rgba(0,0,0,.10) 33%, transparent 40%);
  }
  .hero-tips img { display: block; width: 100%; height: 100%; object-fit: contain;
    filter: brightness(2.1) saturate(1.05) blur(3px) drop-shadow(0 0 26px rgba(150,196,255,.55)); }
  .scrim {
    position: absolute; inset: 0;
    background:
      radial-gradient(64% 46% at 50% 66%, rgba(3,9,18,.93) 0%, rgba(3,9,18,.70) 44%, rgba(3,9,18,.20) 74%, rgba(3,9,18,0) 90%);
  }

  .whale-reflect { position: absolute; left: 50%; margin-left: -152px; top: 430px; width: 304px; height: 304px; transform: rotate(-3deg) scaleY(-1);
    opacity: .30; filter: blur(1.4px) saturate(.55);
    -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,.9) 0%, rgba(0,0,0,.45) 22%, transparent 46%);
    mask-image: linear-gradient(to bottom, rgba(0,0,0,.9) 0%, rgba(0,0,0,.45) 22%, transparent 46%); }
  .whale-reflect img { display: block; width: 100%; height: 100%; object-fit: contain; }

  .spark { position: absolute; border-radius: 50%; background: #CFE2FF; box-shadow: 0 0 10px 2px rgba(150,196,255,.65); }
  .s1 { left: 792px; top: 196px; width: 5px; height: 5px; opacity: .9; }
  .s2 { left: 238px; top: 322px; width: 4px; height: 4px; opacity: .6; }
  .s3 { left: 790px; top: 566px; width: 4px; height: 4px; opacity: .5; }
  .s4 { left: 662px; top: 108px; width: 3px; height: 3px; opacity: .6; }
  .s5 { left: 262px; top: 452px; width: 6px; height: 6px; opacity: .8; }
  .s6 { left: 700px; top: 640px; width: 4px; height: 4px; opacity: .45; }

  /* ocean surface sweep */
  .surface { position: absolute; left: -60px; right: -60px; bottom: 0; height: 250px; }
  .surface::before {
    content: ""; position: absolute; left: 0; right: 0; bottom: 96px; height: 120px;
    background: radial-gradient(60% 100% at 52% 100%, rgba(70,132,226,.30) 0%, rgba(30,68,124,.12) 45%, rgba(4,10,20,0) 78%);
    filter: blur(22px);
  }
  .surface::after {
    content: ""; position: absolute; left: 0; right: 0; bottom: 92px; height: 1px;
    background: linear-gradient(90deg, rgba(120,178,255,0) 4%, rgba(150,200,255,.38) 34%, rgba(150,200,255,.5) 58%, rgba(120,178,255,.05) 100%);
    filter: blur(.5px);
  }
  .caustics { position: absolute; inset: 0; }
  .caustics span { position: absolute; border-radius: 50%; background: rgba(126,190,255,.20); filter: blur(14px); }
  .wave-svg { position: absolute; inset: 0; width: 100%; height: 100%; }

  /* vignette + grain */
  .vignette { position: absolute; inset: 0; background: radial-gradient(120% 105% at 46% 44%, rgba(0,0,0,0) 48%, rgba(1,5,10,.62) 100%); }
  .grain { position: absolute; inset: 0; opacity: .05; mix-blend-mode: overlay; }

  /* ---------- content ---------- */
  .brand { position: absolute; left: 132px; top: 34px; display: flex; align-items: center; gap: 10px; }
  .brand-whale { height: 44px; width: auto; filter: drop-shadow(0 2px 10px rgba(2,6,12,.85)) drop-shadow(0 0 16px rgba(120,178,255,.45)); }
  .brand-wordmark { height: 26px; width: auto; margin-left: 2px; }
  .brand-badge {
    margin-left: 4px; padding: 4px 10px 4px 11px; border-radius: 7px;
    border: 1px solid rgba(191,212,255,.30);
    font-size: 11px; font-weight: 600; letter-spacing: .24em;
    color: rgba(214,230,255,.80); line-height: 1;
  }

  .content { position: absolute; left: 50%; transform: translateX(-50%); top: 392px; bottom: 92px; width: 860px; display: flex; flex-direction: column; align-items: center; text-align: center; justify-content: flex-start; }

  .eyebrow { font-size: 16px; font-weight: 500; letter-spacing: .22em; color: rgba(178,206,255,.72); margin-bottom: 14px; }

  h1 {
    font-size: 86px; line-height: 1.04; font-weight: 700; letter-spacing: .03em;
    color: #F2F7FF;
    background: linear-gradient(176deg, #FFFFFF 8%, #DCE9FF 58%, #B9D1F7 100%);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 2px 18px rgba(3,8,16,.85)) drop-shadow(0 0 44px rgba(90,146,240,.30));
  }

  .sub { margin-top: 18px; font-size: 29px; line-height: 1.42; font-weight: 400; color: rgba(230,240,255,.90); letter-spacing: .01em; text-shadow: 0 2px 16px rgba(3,8,16,.8); }
  .sub-em { color: #8FB8FF; font-weight: 600; }
  .sub-small { margin-top: 12px; font-size: 21px; line-height: 1.5; color: rgba(188,210,244,.68); letter-spacing: .06em; }

  .pills { display: flex; gap: 16px; margin-top: 26px; justify-content: center; }
  .pill {
    display: flex; align-items: center; gap: 8px;
    height: 38px; padding: 0 20px; border-radius: 19px;
    background: rgba(160,196,255,.07);
    border: 1px solid rgba(178,205,255,.17);
    font-size: 20px; letter-spacing: .05em; color: rgba(219,233,255,.86);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.06);
  }
  .pill i { width: 6px; height: 6px; border-radius: 50%; background: #5B9BFF; box-shadow: 0 0 9px 1px rgba(91,155,255,.85); }

  .footer { position: absolute; left: 50%; transform: translateX(-50%); bottom: 46px; display: flex; align-items: center; gap: 10px; font-size: 17px; letter-spacing: .10em; color: rgba(170,201,250,.52); }
  .footer b { font-weight: 500; color: rgba(202,222,255,.70); }
  .footer .sep { width: 3px; height: 3px; border-radius: 50%; background: rgba(163,196,255,.5); }
</style>
</head>
