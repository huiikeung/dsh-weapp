<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;background:#eef1f6;display:flex;gap:24px;padding:24px;font-family:-apple-system,"PingFang SC",sans-serif}
.stage{width:440px;border-radius:16px;overflow:hidden;background:#f6f7f9;height:470px;display:flex;align-items:flex-end}
.pair-sheet { align-self:stretch }
.light{--text:#101318;--text-2:#5b6270;--text-3:#8a91a0;--fill:#eef0f3;--surface:#fff;--border:rgba(16,24,39,.1);--border-strong:rgba(16,24,39,.2);--ocean:#2E6BE6;--divider:rgba(16,24,39,.08)}
.clawbot-experimental-row { gap: 6px; }
.clawbot-experimental-row .exp-copy { min-width: 0; }
/* ---------- 微信 ClawBot 私聊接线（底部弹层 + 居中会话选择） ---------- */
/* .pair-sheet 本身不是 flex 容器：这里显式做成列布局，
   否则子级 flex:1;height:0 会解析成 0 高度把内容吞掉。 */
.clawbot-sheet { display: flex; flex-direction: column; }
.clawbot-sheet > .sheet-grabber-zone,
.clawbot-sheet > .pair-sheet-head { flex: none; }
/* 横向留白由 .pair-sheet 的 padding 提供，这里不要再加，避免双重内缩 */
.clawbot-sheet-body { flex: 1; height: 0; min-height: 0; box-sizing: border-box; }
.clawbot-hero { display: flex; align-items: center; gap: 9px; margin-top: 4px; padding: 11px 12px; border-radius: 10px; border: 0.5px solid var(--border); background: var(--fill); }
.clawbot-hero.is-on { border-color: rgba(25, 135, 84, .28); background: rgba(25, 135, 84, .08); }
.clawbot-hero-dot { width: 8px; height: 8px; flex: none; border-radius: 50%; background: var(--text-3); }
.clawbot-hero.is-on .clawbot-hero-dot { background: #198754; box-shadow: 0 0 0 3px rgba(25, 135, 84, .16); }
.clawbot-hero-copy { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.clawbot-hero-title { font-size: 14px; font-weight: 600; color: var(--text); }
.clawbot-hero.is-on .clawbot-hero-title { color: #198754; }
.clawbot-hero-sub { font-size: 11.5px; color: var(--text-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.clawbot-refresh { flex: none; padding: 4px 9px; border-radius: 499.5px; border: 0.5px solid var(--border); color: var(--text-2); font-size: 11.5px; line-height: 1.4; }
.clawbot-refresh.tap:active { opacity: .7; }
.clawbot-tile-row { display: flex; gap: 8px; margin-top: 10px; }
.clawbot-tile { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; padding: 9px 10px; border-radius: 9px; background: var(--surface); border: 0.5px solid var(--border); }
.clawbot-tile-label { font-size: 11px; color: var(--text-3); }
.clawbot-tile-main { display: flex; align-items: center; gap: 5px; min-width: 0; }
.clawbot-tile-value { flex: 1; min-width: 0; font-size: 13px; font-weight: 500; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.clawbot-tile-chevron { flex: none; font-size: 15px; line-height: 1; color: var(--text-3); }
.clawbot-tile-tap:active { opacity: .7; }
.clawbot-message { display: block; margin-top: 8px; }
.clawbot-error,
.clawbot-muted,
.clawbot-footnote { display: block; color: var(--text-3); font-size: 11.5px; line-height: 1.55; }
.clawbot-error { margin-top: 8px; padding: 7px 9px; border-radius: 7px; background: rgba(196, 72, 72, .1); color: #c44848; overflow-wrap: anywhere; }
.clawbot-footnote { margin-top: 12px; }
.clawbot-ops { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 11px; }
.clawbot-op { flex: 1 1 30%; min-width: 90px; min-height: 44px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; padding: 0 9px; border-radius: 8px; border: 0.5px solid var(--border-strong); background: var(--surface); }
.clawbot-op:active { opacity: .72; }
.clawbot-op-title { font-size: 12.5px; font-weight: 500; color: var(--text); text-align: center; }
.clawbot-op.is-danger { border-color: rgba(196, 72, 72, .34); }
.clawbot-op.is-danger .clawbot-op-title { color: #c44848; }
.clawbot-op.is-disabled { opacity: .45; }
.clawbot-pairing { display: flex; flex-direction: column; align-items: center; gap: 6px; margin-top: 11px; padding: 11px; border-radius: 9px; background: var(--surface); border: 0.5px solid var(--border); }
/* 居中会话选择弹窗 */
.clawbot-modal-mask { position: fixed; inset: 0; z-index: 1200; display: flex; align-items: center; justify-content: center; padding: 20px; background: rgba(0, 0, 0, .45); }
.clawbot-modal { width: 100%; max-width: 310px; max-height: 72vh; box-sizing: border-box; display: flex; flex-direction: column; padding: 15px 15px 12px; border-radius: 12px; background: var(--surface); border: 0.5px solid var(--border); box-shadow: 0 12px 36px rgba(0, 0, 0, .3); animation: clawbot-modal-in .18s ease-out; }
.clawbot-modal-head { flex: none; display: flex; align-items: center; gap: 8px; }
.clawbot-modal-title { flex: 1; min-width: 0; font-size: 15px; font-weight: 600; color: var(--text); }
.clawbot-modal-close { flex: none; width: 26px; height: 26px; line-height: 24px; text-align: center; border-radius: 7px; font-size: 19px; color: var(--text-2); background: var(--fill); }
.clawbot-modal-sub { flex: none; margin-top: 4px; font-size: 11.5px; color: var(--text-3); }
.clawbot-modal-body { flex: 1; height: 0; min-height: 0; margin-top: 9px; }
.clawbot-modal-empty { padding: 30px 10px; text-align: center; font-size: 12px; color: var(--text-3); }
/* 二维码 / 确认码 / 会话行 */
.clawbot-qr { width: 160px; height: 160px; border-radius: 8px; background: #fff; }
.clawbot-pairing-hint { font-size: 11.5px; color: var(--text-3); text-align: center; }
.clawbot-verify-row { display: flex; align-items: center; gap: 6px; margin-top: 4px; width: 100%; }
.clawbot-verify-input { flex: 1; min-width: 0; height: 38px; padding: 0 10px; box-sizing: border-box; border-radius: 7px; border: 0.5px solid var(--border-strong); background: var(--fill); color: var(--text); font-size: 12.5px; }
.clawbot-action { flex: none; min-height: 38px; display: flex; align-items: center; justify-content: center; padding: 0 12px; border-radius: 7px; border: 0.5px solid var(--border-strong); background: var(--surface); color: var(--text); font-size: 12px; }
.clawbot-text-action { color: var(--ocean); font-size: 12px; line-height: 1.4; }
.clawbot-cancel-login { margin-top: 5px; text-align: center; }
.clawbot-session-option { display: flex; align-items: center; gap: 8px; padding: 11px 10px; border-radius: 8px; border: 0.5px solid var(--border); background: var(--surface); margin-bottom: 6px; }
.clawbot-session-option.selected { border-color: var(--ocean); background: var(--fill); }
.clawbot-session-option:active { opacity: .72; }
.clawbot-session-check { color: var(--ocean); }
.clawbot-session-copy { display: flex; flex: 1; min-width: 0; flex-direction: column; gap: 1.5px; }
.clawbot-session-title { color: var(--text); font-size: 12px; overflow-wrap: anywhere; }
.clawbot-session-check { flex: none; font-size: 14px; }
.clawbot-footnote { margin-top: 9px; }
.management-sheet .pair-sheet-head { flex-shrink: 0;
  gap: 8px; }
.management-sheet .pair-sheet-head > view:first-child { flex: 1;
  min-width: 0; }
.management-sheet .pair-sheet-subtitle { overflow-wrap: anywhere; word-break: break-all; }
.pair-sheet-close { flex: none;
  margin-left: auto;          /* 贴住右侧 */
  align-self: center;
  display: flex;
  align-items: center;
  justify-content: flex-end;
  width: 32px;
  height: 32px;
  padding: 0; }
/* 标题区可压缩，避免把「关闭」挤成两行 */
.pair-sheet-head > view:first-child { flex: 1;
  min-width: 0; }
/* 标题区可压缩，避免把「关闭」挤成两行 */
.pair-sheet-head > view:first-child { flex: 1;
  min-width: 0; }
.pair-sheet-mask { position: fixed;
  z-index: 100;
  inset: 0;
  display: flex;
  align-items: flex-end;
  background: rgba(0, 0, 0, 0.42); }
.pair-sheet { width: 100%;
  box-sizing: border-box;
  padding: 5px 20px calc(16px + env(safe-area-inset-bottom));
  border-radius: 16px 16px 0 0;
  background: var(--surface);
  color: var(--text); }
.pair-sheet-head { display: flex;
  align-items: center;        /* 关闭图标与标题同一水平线 */
  justify-content: space-between;
  gap: 8px;
  margin: 8px 0 12px; }
.pair-sheet-head > view:first-child { flex: 1;
  min-width: 0; }
.pair-sheet-title { display: block;
  color: var(--text);
  font-size: 17px;
  font-weight: 650; }
.pair-sheet-subtitle { display: block;
  margin-top: 4px;
  color: var(--text-2);
  font-size: 11.5px; }
.pair-sheet-close { display: flex;
  align-items: center;
  justify-content: flex-end;
  min-width: 32px;
  min-height: 32px;
  padding: 0;
  flex-shrink: 0; }
/* ---------- 可拖动/点击调整高度的弹窗 ---------- */
.sheet-grabber-zone { display: flex;
  align-items: center;
  justify-content: center;
  min-height: 24px;
  padding: 4px 0;
  margin-bottom: 2px;
  flex-shrink: 0; }
.pair-sheet.resizable { transition: height 0.24s cubic-bezier(0.32, 0.72, 0, 1); }
/* 震动/外观弹窗中的说明 */
.appearance-sheet .pair-sheet-subtitle { display: block;
  margin-top: 4px; }
</style></head><body><div class="stage light">
  <div class="pair-sheet resizable clawbot-sheet" style="height:430px">
    <div class="sheet-grabber-zone"><div class="sheet-grabber"></div></div>
    <div class="pair-sheet-head">
      <div><div class="pair-sheet-title">微信 ClawBot 私聊接线</div><div class="pair-sheet-subtitle">将微信私聊接入指定 DSH 会话</div></div>
      <div class="pair-sheet-close"><div class="sheet-close-x"></div></div>
    </div>
    <div class="clawbot-sheet-body">
      <div class="clawbot-hero is-on"><div class="clawbot-hero-dot"></div><div class="clawbot-hero-copy"><div class="clawbot-hero-title">私聊接线已启用</div><div class="clawbot-hero-sub">立即推送预览</div></div><div class="clawbot-refresh">刷新</div></div>
      <div class="clawbot-tile-row"><div class="clawbot-tile clawbot-tile-tap"><div class="clawbot-tile-label">接入会话</div><div class="clawbot-tile-main"><div class="clawbot-tile-value">立即推送预览</div><div class="clawbot-tile-chevron">›</div></div></div></div>
      <div class="clawbot-ops"><div class="clawbot-op"><div class="clawbot-op-title">重新绑定微信</div></div><div class="clawbot-op"><div class="clawbot-op-title">选择接入会话</div></div><div class="clawbot-op is-danger"><div class="clawbot-op-title">移除绑定</div></div></div>
      <div class="clawbot-footnote">启用后，微信私聊会提交到所选会话；这不会创建新的 Agent 预设或绕过电脑端权限。</div>
    </div>
  </div>
</div></body></html>
